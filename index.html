<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo-original.png" />
    <link rel="shortcut icon" type="image/png" href="/assets/logo-original.png" />
    <link rel="apple-touch-icon" href="/assets/logo-original.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8f8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>RESOLVE Notebook — mais vida para o seu notebook</title>
    <meta name="description" content="Assistência técnica especializada e venda de notebooks na Santa Ifigênia, São Paulo. Upgrades, reparo de placas, telas, baterias e manutenção preventiva." />
    <!-- Auto-recovery against stale browser cache -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.indexOf('Unexpected token') !== -1 || e.message.indexOf('Loading chunk') !== -1)) {
          if (!sessionStorage.getItem('reloaded_once_cache')) {
            sessionStorage.setItem('reloaded_once_cache', 'true');
            window.location.reload(true);
          }
        }
      });
    </script>
    <!-- Google Fonts: Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
